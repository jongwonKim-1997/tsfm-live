[project]
name = "tsfm-live"
version = "0.1.0"
description = "Prospective time-series model evaluation with an append-only public ledger"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.11,<2",
  "pydantic>=2.10,<3", "PyYAML>=6,<7", "requests>=2.32,<3", "certifi>=2025.1.31",
  "pyarrow>=18,<24", "exchange-calendars>=4.10,<5",
  "pandas-market-calendars>=5,<6", "tzdata>=2025.2", "filelock>=3.16,<4",
  "jsonschema>=4.23,<5", "Pillow>=11,<13",
]

[project.scripts]
tsfm-live = "tsfm_live.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tsfm_live"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
